name: generate-builds
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  generate-2ship-otr:
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
    - name: Restore Cached deps folder
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ github.ref }}-
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Install latest SDL
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest tinyxml2
      run: |
        sudo apt-get remove libtinyxml2-dev
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/tinyxml2-10.0.0" ]; then
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
        fi
        cd deps/tinyxml2-10.0.0
        mkdir -p build
        cd build
        cmake ..
        make
        sudo make install
    - name: Generate 2ship.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake --config Release --target Generate2ShipOtr -j3
    - name: Upload 2ship.o2r
      uses: actions/upload-artifact@v7
      with:
        name: 2ship.o2r
        path: 2ship.o2r
        retention-days: 3

  build-switch:
    needs: generate-2ship-otr
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
    - name: Install tools
      run: |
        apt-get update
        apt-get install -y ninja-build python3 git curl zip
        dkp-pacman -Syu --noconfirm --needed switch-sdl2 switch-glad switch-libpng switch-zlib switch-bzip2 switch-libopus switch-opusfile switch-libvorbis switch-libogg switch-mesa switch-glm || true
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Build Switch .nro
      run: |
        git config --global --add safe.directory '*'
        /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -H. -Bbuild-switch -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-switch --config Release -j4
        find build-switch -name "*.nro"
    - name: Download 2ship.o2r
      uses: actions/download-artifact@v7
      with:
        name: 2ship.o2r
        path: o2r
    - name: Package
      run: |
        mkdir -p out/switch/2ship
        cp "$(find build-switch -name '*.nro' | head -n1)" out/switch/2ship/2ship.nro
        cp o2r/2ship.o2r out/switch/2ship/
        cp switch-pack/settings.json out/switch/2ship/2ship2harkinian.json
        cp switch-pack/README.txt out/ || true
    - name: Upload debug symbols
      uses: actions/upload-artifact@v7
      with:
        name: debug-elf
        path: build-switch/mm/*.elf
        retention-days: 30
        if-no-files-found: warn
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: MM-Modern-Switch
        path: out
        retention-days: 30
    - name: Zip for release
      run: cd out && zip -r ../MM-Modern-Switch.zip .
    - name: Publish "latest" release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: MM Modern for Switch (latest build)
        body: |
          Download MM-Modern-Switch.zip, copy its "switch" folder to your SD card, and add your own mm.o2r
          (made with 2Ship2Harkinian 5.0.1 on PC) to /switch/2ship/. See the README for details.
        files: MM-Modern-Switch.zip
        make_latest: true

  # Test build: the unchanged Switch port, built the same way, to tell toolchain problems from MM Modern bugs.
  build-switch-vanilla:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
    - name: Install tools
      run: |
        apt-get update
        apt-get install -y ninja-build python3 git curl zip
        dkp-pacman -Syu --noconfirm --needed switch-sdl2 switch-glad switch-libpng switch-zlib switch-bzip2 switch-libopus switch-opusfile switch-libvorbis switch-libogg switch-mesa switch-glm || true
    - name: Checkout unchanged port
      uses: actions/checkout@v6
      with:
        repository: reflex909/2ship2harkinian-Switch
        ref: e1b0436d3c580e193d68fe9dbc915522074aff32
        submodules: recursive
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        mkdir -p mm/switch && curl -sSfL https://raw.githubusercontent.com/${{ github.repository }}/main/mm/switch/2s2hIcon.png -o mm/switch/2s2hIcon.png
        /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -H. -Bbuild-switch -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-switch --config Release -j4
        mkdir -p out && cp "$(find build-switch -name '*.nro' | head -n1)" out/2ship-vanilla-test.nro
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: vanilla-test-nro
        path: out
        retention-days: 14
